name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .tools
          key: godot-${{ hashFiles('tools/env.sh') }}
      - name: Install Godot and gdtoolkit
        run: ./tools/install_tools.sh
      - name: Lint and format check
        run: ./tools/lint.sh
      - name: Unit tests (GUT, headless)
        run: ./tools/run_tests.sh
      - name: Compile all scripts and boot the project headless
        run: ./tools/check_project.sh
      - name: Export the Android and iOS data packs and check their contents
        run: ./tools/check_export.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .tools
          key: godot-${{ hashFiles('tools/env.sh') }}
      - name: Install Godot and gdtoolkit
        run: ./tools/install_tools.sh
      - name: Edge function tests and SQL migrations + row-level security (local Postgres)
        run: ./tools/test_backend.sh
      - name: Online client end to end against the mock backend
        run: ./tools/test_online.sh
